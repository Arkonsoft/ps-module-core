name: PHP Compatibility

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      php_version:
        description: 'PHP version to test (leave empty for all versions 7.0-8.2)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - '7.0'
          - '7.1'
          - '7.2'
          - '7.3'
          - '7.4'
          - '8.0'
          - '8.1'
          - '8.2'

jobs:
  php7-compatibility:
    runs-on: ubuntu-latest
    env:
      EXCLUDE_DIR_OPTS: --exclude-dir=vendor --exclude-dir=.github --exclude-dir=.git
    
    strategy:
      matrix:
        php-version: ${{ github.event.inputs.php_version == '' && fromJSON('["7.0", "7.1", "7.2", "7.3", "7.4", "8.0", "8.1", "8.2"]') || fromJSON(format('["{0}"]', github.event.inputs.php_version)) }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, soap, apcu, xdebug
        coverage: none
        
    - name: Get composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      
    - name: Cache composer dependencies
      uses: actions/cache@v3
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-
        
    - name: Install dependencies
      run: |
        if [[ "${{ matrix.php-version }}" == "7.0" || "${{ matrix.php-version }}" == "7.1" ]]; then
          composer install --prefer-dist --no-progress --no-suggest --no-dev
        else
          composer install --prefer-dist --no-progress --no-suggest
        fi

    - name: Prepare source discovery
      run: |
        cat > /tmp/find-source-php.sh <<'EOF'
        #!/usr/bin/env bash
        find . -name '*.php' \
          ! -path './vendor/*' \
          ! -path './.github/*' \
          ! -path './.git/*' \
          "$@"
        EOF
        chmod +x /tmp/find-source-php.sh
      
    - name: Copy PHPStan configuration
      if: ${{ matrix.php-version != '7.0' && matrix.php-version != '7.1' }}
      run: cp .github/workflows/phpstan.neon phpstan.neon
        
    - name: Run PHPStan analysis
      if: ${{ matrix.php-version != '7.0' && matrix.php-version != '7.1' }}
      run: ./vendor/bin/phpstan analyse --memory-limit=1G
      
    - name: Check for PHP 7.0 specific syntax
      run: |
        echo "Checking for PHP 7.0 incompatible syntax..."

        fail_if_found() {
          local message="$1"
          shift
          local match
          match=$("$@" | grep -vE '^\s*(\*|//)' | grep -v '@' | head -1)
          if [ -n "$match" ]; then
            echo "$match"
            echo "$message"
            exit 1
          fi
        }

        fail_if_found "Found nullable type hints (PHP 7.1+)" \
          grep -rE '\?(string|int|float|bool|array|callable|iterable|self|static|parent|[A-Z][a-zA-Z0-9_\\]*)' . --include="*.php" $EXCLUDE_DIR_OPTS
        fail_if_found "Found object type hint (PHP 7.2+)" \
          grep -rE ':\s*object\b' . --include="*.php" $EXCLUDE_DIR_OPTS
        fail_if_found "Found arrow functions (PHP 7.4+)" \
          grep -rE 'fn\s*\(' . --include="*.php" $EXCLUDE_DIR_OPTS
        fail_if_found "Found null coalescing assignment (PHP 7.4+)" \
          grep -rF '??=' . --include="*.php" $EXCLUDE_DIR_OPTS
        fail_if_found "Found match expressions (PHP 8.0+)" \
          grep -rE 'match\s*\(' . --include="*.php" $EXCLUDE_DIR_OPTS
        fail_if_found "Found attributes (PHP 8.0+)" \
          grep -rE '#\[[A-Z]' . --include="*.php" $EXCLUDE_DIR_OPTS
        fail_if_found "Found ::class on object (PHP 8.0+)" \
          grep -rE '::class\s*$' . --include="*.php" $EXCLUDE_DIR_OPTS
        fail_if_found "Found mixed type hint (PHP 8.0+)" \
          grep -rE ':\s*mixed\b' . --include="*.php" $EXCLUDE_DIR_OPTS
        fail_if_found "Found enums (PHP 8.1+)" \
          grep -rE '\benum\s+' . --include="*.php" $EXCLUDE_DIR_OPTS
        fail_if_found "Found readonly properties (PHP 8.1+)" \
          grep -rE '\breadonly\s+' . --include="*.php" $EXCLUDE_DIR_OPTS
        fail_if_found "Found never return type (PHP 8.1+)" \
          grep -rE ':\s*never\b' . --include="*.php" $EXCLUDE_DIR_OPTS
        fail_if_found "Found true type (PHP 8.2+)" \
          grep -rE '\)\s*:\s*true\b|(public|protected|private)\s+true\s+\$|[(,]\s*true\s+\$' . --include="*.php" $EXCLUDE_DIR_OPTS
        fail_if_found "Found false type (PHP 8.2+)" \
          grep -rE '\)\s*:\s*false\b|(public|protected|private)\s+false\s+\$|[(,]\s*false\s+\$' . --include="*.php" $EXCLUDE_DIR_OPTS
        fail_if_found "Found null type (PHP 8.2+)" \
          grep -rE '\)\s*:\s*null\b|(public|protected|private)\s+null\s+\$|[(,]\s*null\s+\$' . --include="*.php" $EXCLUDE_DIR_OPTS

        echo "No PHP 7.0 incompatible syntax found!"
        
    - name: Validate composer.json PHP version constraint
      run: |
        echo "Checking composer.json PHP version constraint..."
        php_version=$(composer config platform.php)
        if [[ "$php_version" != "7.0"* ]]; then
          echo "Warning: Platform PHP version is not 7.0.x"
        fi
        
        # Check if composer.json requires PHP 7.0+
        if ! grep -q '"php":\s*">=7.0"' composer.json; then
          echo "Warning: composer.json should require PHP >=7.0"
        fi
        
    - name: Test with PHP 7.0 syntax
      run: |
        echo "Testing PHP 7.0 syntax compatibility..."
        /tmp/find-source-php.sh -exec php -l {} \; | grep -v "No syntax errors" || true
        
    - name: Generate compatibility report
      run: |
        echo "# PHP Compatibility Report (7.0-8.2)" > compatibility-report.md
        echo "Generated on: $(date)" >> compatibility-report.md
        echo "" >> compatibility-report.md
        echo "## Trigger: ${{ github.event_name }}" >> compatibility-report.md
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "## Manual run by: ${{ github.actor }}" >> compatibility-report.md
          echo "## Selected PHP version: ${{ github.event.inputs.php_version || 'All versions' }}" >> compatibility-report.md
        fi
        echo "" >> compatibility-report.md
        echo "## PHP Version: ${{ matrix.php-version }}" >> compatibility-report.md
        echo "" >> compatibility-report.md
        echo "## Files analyzed:" >> compatibility-report.md
        /tmp/find-source-php.sh | wc -l >> compatibility-report.md
        echo "" >> compatibility-report.md
        echo "## Status: ✅ Compatible with PHP ${{ matrix.php-version }}" >> compatibility-report.md
        
    - name: Upload compatibility report
      uses: actions/upload-artifact@v4
      with:
        name: php-compatibility-report-${{ matrix.php-version }}
        path: compatibility-report.md
